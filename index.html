function detailView(){const p=getProduct(route.id);if(!p)return `<div class="container section">Prenda no disponible.</div>`;record('producto_abierto',{id:p.id});return `<div class="container section" style="padding-top:28px">${back()}<div class="detail"><div class="detail-art">${iconGarment(p)}</div><div class="detail-side"><span class="caps muted">${safe(p.brand)} · ${safe(p.cat)}</span><h1>${safe(p.name)}</h1><div class="price" style="font-size:1.6rem">${money(p.price)}</div><p><span class="badge">${safe(p.state)}</span> <span class="badge alt">Segunda mano</span></p><p>${safe(p.desc)}</p><div class="facts"><div class="fact"><strong>Talla</strong><div>${safe(p.size)}</div></div><div class="fact"><strong>Material</strong><div>${safe(p.fabric)}</div></div><div class="fact"><strong>Usos declarados</strong><div>${safe(p.uses)}</div></div><div class="fact"><strong>Ubicación referencial</strong><div>${safe(p.address)}</div></div></div><h3>Medidas reales declaradas</h3><div class="small">${Object.entries(p.measures||{}).filter(([k,v])=>v>0).map(([k,v])=>`${{bust:'Busto',waist:'Cintura',hip:'Cadera'}[k]}: ${v} cm`).join(' · ')||'No informadas'}</div><hr class="divider"><h3>Estado real de la prenda</h3><p class="small">${safe(p.defects||'No se declararon defectos')}. ${safe(p.state)}. La condición es información proporcionada en el catálogo simulado.</p><div class="notice small">La ilustración es referencial, no constituye una fotografía ni certificación del estado real.</div><hr class="divider"><h3>Vendedora</h3><p>◯ ${safe(p.seller)} <span class="muted small">· ${safe(p.rating)}</span></p><div class="stack">${btn('Ver cómo me quedaría','data-fit="'+p.id+'"')}${btn('Comprar con pago protegido','data-checkout="'+p.id+'"','btn-outline')}</div><p class="micro muted">Esta es una experiencia de demostración. Ningún pago ni entrega será real.</p></div></div></div>`}

const steps=['Fotos','Información','Medidas','Estado','Precio','Vista previa'];
function pf(name){return safe(form[name]??'')}

case 1:content=`<h3>Cuéntanos sobre tu prenda</h3><div class="columns2"><div class="field"><label for="pName">Título de la publicación *</label><input id="pName" data-pf="name" value="${pf('name')}" required placeholder="Ej. Blazer azul elegante"></div><div class="field"><label for="pBrand">Marca *</label><input id="pBrand" data-pf="brand" value="${pf('brand')}" required placeholder="Ej. Zara"></div><div class="field"><label for="pCat">Categoría *</label><select id="pCat" data-pf="cat">${['Blazers','Vestidos','Jeans','Casacas','Blusas','Faldas'].map(x=>`<option ${form.cat===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="pSize">Talla de etiqueta *</label><select id="pSize" data-pf="size">${['S','M','L','XS','XL','28','30','32'].map(x=>`<option ${form.size===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="pFabric">Material</label><input id="pFabric" data-pf="fabric" value="${pf('fabric')}" placeholder="Ej. Algodón"></div><div class="field"><label for="pStyle">Estilo</label><select id="pStyle" data-pf="style">${['Casual','Clásico','Minimalista','Vintage','Romántico'].map(x=>`<option ${form.style===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label for="pDesc">Descripción</label><textarea id="pDesc" data-pf="desc" placeholder="Describe cómo es tu prenda">${pf('desc')}</textarea></div><button class="btn btn-soft" data-assist>✧ Ayúdame a completar la publicación</button><p class="micro muted">La sugerencia se genera con reglas de ejemplo y tú decides si usarla.</p>`;break;
case 2:content=`<h3>Medidas claras, menos dudas</h3><p class="muted">Mide la prenda extendida según corresponda. Ingresa circunferencias o medidas equivalentes en centímetros. [SUPUESTO: criterio de medición demostrativo]</p><div class="columns3">${[['bust','Busto'],['waist','Cintura'],['hip','Cadera']].map(([k,label])=>`<div class="field"><label for="m_${k}">${label} (cm)</label><input type="number" id="m_${k}" data-pf="${k}" value="${pf(k)}" min="0" max="250" placeholder="Ej. 90"></div>`).join('')}</div><div class="notice">Tus medidas serán visibles en la ficha para ayudar a compradoras a evaluar el ajuste.</div>`;break;
case 3:content=`<h3>Describe su estado con transparencia</h3><div class="field"><label for="pState">Estado *</label><select id="pState" data-pf="state">${['Excelente','Muy bueno','Bueno'].map(x=>`<option ${form.state===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="pUses">Cantidad aproximada de usos</label><select id="pUses" data-pf="uses">${['1 o 2 veces','3 a 5 veces','6 a 10 veces','Más de 10 veces'].map(x=>`<option ${form.uses===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="pDefects">Defectos o señales de uso *</label><textarea id="pDefects" data-pf="defects" placeholder="Ej. Pequeña marca en manga o sin defectos declarados">${pf('defects')}</textarea></div><div class="notice warning small">Una imagen embellecida artificialmente no debe ocultar manchas, desgaste ni defectos reales.</div>`;break;
case 4:content=`<h3>El precio lo decides tú</h3><div class="field"><label for="pPrice">Precio de venta (S/) *</label><input type="number" id="pPrice" data-pf="price" value="${pf('price')}" min="1" max="99999" placeholder="Ej. 85"></div><button class="btn btn-soft" data-pricehint>Ver un rango sugerido</button><div id="priceResult"></div><p class="micro muted">Sugerencia ficticia mediante reglas locales, no análisis del mercado ni IA real.</p>`;break;
case 5:content=`<h3>Revisa antes de publicar</h3><p class="muted">Puedes regresar y modificar cualquier campo.</p><div class="summary"><div class="summary-row"><span>Prenda</span><strong>${pf('name')||'Sin título'}</strong></div><div class="summary-row"><span>Marca / talla</span><strong>${pf('brand')} · ${pf('size')}</strong></div><div class="summary-row"><span>Estado</span><strong>${pf('state')}</strong></div><div class="summary-row"><span>Medidas</span><strong>${['bust','waist','hip'].map(k=>pf(k)||'—').join(' / ')} cm</strong></div><div class="summary-row"><span>Precio</span><strong>${money(form.price||0)}</strong></div></div><p><strong>Descripción:</strong> ${pf('desc')||'No ingresada'}</p><p><strong>Defectos declarados:</strong> ${pf('defects')||'No indicados'}</p><div class="notice small">Tu anuncio estará visible únicamente en esta demostración y se guardará en este navegador.</div>`;break;}
return `<div class="container section" style="padding-top:28px">${back('seller')}<div class="columns2" style="grid-template-columns:1.4fr .6fr"><div class="panel"><div class="caps muted">Publicar una prenda · Paso ${formStep+1} de ${steps.length}</div><div class="steps">${steps.map((_,i)=>`<div class="step ${i<=formStep?'current':''}"></div>`).join('')}</div><div id="postContent">${content}</div><hr class="divider"><div style="display:flex;justify-content:space-between;gap:10px">${formStep?btn('← Anterior','data-postback','btn-outline'):'<span></span>'}${formStep===steps.length-1?btn('Publicar prenda','data-publish'):btn('Continuar →','data-postnext')}</div></div><div><div class="panel"><h3>Publica a tu ritmo.</h3><p>Información transparente sobre medidas y estado ayuda a evitar dudas de quien compra.</p><div class="notice small">Este flujo es de prueba. No existen ventas ni cobros reales.</div><hr class="divider">${btn('Guardar borrador','data-savedraft','btn-outline')}</div></div></div></div>`}

function readForm(){document.querySelectorAll('[data-pf]').forEach(el=>form[el.dataset.pf]=el.value);}
function mandatoryOK(){if(formStep===1&&!String(form.name||'').trim())return 'Agrega el título de la prenda.';if(formStep===1&&!String(form.brand||'').trim())return 'Agrega la marca.';if(formStep===3&&!String(form.defects||'').trim())return 'Describe los defectos o indica que no identificaste ninguno.';if(formStep===4&&!(Number(form.price)>0))return 'Ingresa un precio válido mayor a cero.';return null;}
function assist(){readForm();let name=form.name||`${form.cat||'Prenda'} ${form.brand||''}`.trim(),desc=`${name} de ${form.brand||'marca no especificada'}, talla ${form.size||'por confirmar'}. ${form.fabric?'Material: '+form.fabric+'. ':''}Prenda de estilo ${(form.style||'casual').toLowerCase()}. Revisa las medidas y el estado antes de decidir.`;const host=$('#modalHost');host.innerHTML=`<div class="modal-cover" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="assistantTitle"><div class="modal-top"><h3 id="assistantTitle">Sugerencia de descripción</h3><button class="ghost" data-close aria-label="Cerrar">✕</button></div><p class="small muted">Generada con reglas locales a partir de los campos ingresados; no usa IA.</p><div class="field"><label for="assistText">Puedes editar esta propuesta</label><textarea id="assistText">${safe(desc)}</textarea></div>${btn('Usar esta descripción','data-acceptdesc')}&nbsp;${btn('Descartar','data-close','btn-outline')}</div></div>`;record('asistencia_solicitada');}
function estimatePrice(){readForm();const base={Blazers:90,Vestidos:75,Jeans:85,Casacas:76,Blusas:70,Faldas:60}[form.cat]||70;let factor={'Excelente':1.1,'Muy bueno':1,'Bueno':.8}[form.state]||1;let center=base*factor;$('#priceResult').innerHTML=`<div class="check-result"><strong>Rango ilustrativo: ${money(Math.round(center*.85))} – ${money(Math.round(center*1.15))}</strong><p class="small">No se calculó con datos de mercado. Puedes elegir otro precio.</p></div>`;record('precio_sugerido');}
function feedback(scope,val){const responses=store.get('feedback',[]);responses.push({scope,val,time:new Date().toISOString(),product:route.id});store.set('feedback',responses);record('feedback',{scope,val});showToast('Gracias, tu respuesta quedó guardada en este navegador.');document.querySelectorAll(`[data-feedback="${scope}"] button`).forEach(x=>x.classList.toggle('selected',x.dataset.answer===val));}
function handleClick(e){const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return;}if(b.dataset.product){go('detail',b.dataset.product);return;}if(b.dataset.fit){record('ajuste_abierto',{id:b.dataset.fit});go('fit',b.dataset.fit);return;}if(b.dataset.try){record('probador_abierto',{id:b.dataset.try});go('tryon',b.dataset.try);return;}if(b.dataset.checkout){go('checkout',b.dataset.checkout);return;}if(b.dataset.fav){const id=Number(b.dataset.fav),a=store.get('favorites',[]);store.set('favorites',a.includes(id)?a.filter(x=>x!==id):[...a,id]);record('favorito',{id});render();return;}if(b.hasAttribute('data-clearfilters')){filters={search:'',cat:'Todas',size:'Todas',state:'Todos',sort:'Recomendados'};render();return;}if(b.hasAttribute('data-newpost')){form={};formStep=0;previewPhoto=null;go('post');return;}if(b.hasAttribute('data-resume')){form=store.get('draft',{});formStep=0;go('post');return;}if(b.hasAttribute('data-postnext')){readForm();const error=mandatoryOK();if(error)return showToast(error);formStep++;if(formStep===1){form.cat||='Blazers';form.size||='S';form.style||='Casual';}if(formStep===3){form.state||='Excelente';form.uses||='1 o 2 veces';}render();return;}if(b.hasAttribute('data-postback')){readForm();formStep=Math.max(0,formStep-1);render();return;}if(b.hasAttribute('data-savedraft')){readForm();store.set('draft',form);showToast('Borrador guardado en este navegador.');record('borrador_guardado');return;}if(b.hasAttribute('data-assist')){assist();return;}if(b.hasAttribute('data-pricehint')){estimatePrice();return;}if(b.hasAttribute('data-close')){$('#modalHost').innerHTML='';return;}if(b.hasAttribute('data-acceptdesc')){form.desc=$('#assistText').value;$('#modalHost').innerHTML='';record('descripcion_aceptada');render();showToast('Descripción incorporada. Puedes seguir editándola.');return;}if(b.hasAttribute('data-publish')){readForm();if(!form.name||!form.brand||!Number(form.price)||!form.defects)return showToast('Revisa los campos obligatorios antes de publicar.');let p={id:Date.now(),name:form.name,brand:form.brand,cat:form.cat||'Blazers',size:form.size||'M',style:form.style||'Casual',price:Number(form.price),state:form.state||'Bueno',uses:form.uses||'No informado',fabric:form.fabric||'No informado',defects:form.defects,desc:form.desc||'Descripción pendiente',seller:'Mi perfil (demo)',rating:'Perfil de demostración',color:'#a9bcae',bg:'#eceee9',kind:{Blazers:'blazer',Vestidos:'dress',Jeans:'pants',Casacas:'jacket',Blusas:'shirt',Faldas:'skirt'}[form.cat]||'shirt',measures:{bust:Number(form.bust)||0,waist:Number(form.waist)||0,hip:Number(form.hip)||0},address:'Lima'};store.set('products',[...store.get('products',[]),p]);store.set('draft',null);record('publicacion_completada',{id:p.id});go('seller');showToast('Prenda publicada en tu catálogo de demostración.');const host=$('#modalHost');host.innerHTML=`<div class="modal-cover"><div class="modal" role="dialog" aria-modal="true"><div class="modal-top"><h3>¡Publicaste tu prenda!</h3><button class="ghost" data-close>✕</button></div><p>Tu anuncio está disponible en este navegador.</p><h3>¿Este proceso te resultó más sencillo que publicar una prenda por tu cuenta?</h3><div class="inline-choice" data-feedback="seller">${['Mucho','Algo','Poco','Nada'].map(x=>`<button data-answer="${x}">${x}</button>`).join('')}</div></div></div>`;return;}if(b.dataset.answer){feedback(b.closest('[data-feedback]').dataset.feedback,b.dataset.answer);return;}if(b.hasAttribute('data-complaint')){record('reclamo_simulado');showToast('En el producto final aquí se abriría un reporte de incidencia.');return;}}
function handleChange(e){const el=e.target;if(el.id==='fSearch'||['fCat','fSize','fState','fSort'].includes(el.id)){let field={fSearch:'search',fCat:'cat',fSize:'size',fState:'state',fSort:'sort'}[el.id];filters[field]=el.value;record('filtro_usado',{field,value:el.value});render();if(field==='search')$('#fSearch')?.focus();return;}if(el.id==='photoInput'){const file=el.files?.[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>5e6)return showToast('Selecciona una imagen de hasta 5 MB.');const reader=new FileReader();reader.onload=()=>{tryPhoto=String(reader.result);const area=$('#avatarDemo');area.querySelector('.photo-preview')?.remove();const img=document.createElement('img');img.className='photo-preview';img.alt='Foto local elegida';img.src=tryPhoto;area.insertBefore(img,area.querySelector('.overlay'));showToast('Foto cargada solo para la vista local.');};reader.readAsDataURL(file);return;}if(el.id==='overlayIntensity'){$('#garmentOverlay').style.opacity=Number(el.value)/100;return;}if(el.id==='pPhoto'){const file=el.files?.[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>5e6)return showToast('Selecciona una imagen de hasta 5 MB.');const reader=new FileReader();reader.onload=()=>{previewPhoto=String(reader.result);render()};reader.readAsDataURL(file);}}
function handleSubmit(e){if(e.target.id==='fitForm'){e.preventDefault();const m={bust:Number($('#fitBust').value),waist:Number($('#fitWaist').value),hip:Number($('#fitHip').value),height:Number($('#fitHeight').value)};if(![m.bust,m.waist,m.hip].some(v=>v>0))return showToast('Ingresa por lo menos una medida para comparar.');for(const [k,v] of Object.entries(m))if(v!==0&&(v<40||v>220))return showToast('Revisa las medidas ingresadas.');store.set('measurements',m);const p=getProduct(route.id),terms={bust:'busto',waist:'cintura',hip:'cadera'},comparisons=[];for(const k of ['bust','waist','hip']){if(!m[k]||!p.measures?.[k])continue;let diff=p.measures[k]-m[k];if(diff<0)comparisons.push(`En ${terms[k]}, la prenda mide ${Math.abs(diff)} cm menos que tu referencia; podría quedar ajustada.`);else if(diff<=4)comparisons.push(`En ${terms[k]}, las medidas son cercanas; revisa el tipo de tela.`);else comparisons.push(`En ${terms[k]}, hay ${diff} cm de holgura aproximada.`)}let headline=comparisons.some(x=>x.includes('menos'))?'Revisa el ajuste con atención':'Compatibilidad orientativa';$('#fitResult').innerHTML=`<div class="check-result"><strong>${headline}</strong><p class="small">${comparisons.length?comparisons.map(safe).join('<br>'):'No hay medidas suficientes de esta prenda para comparar.'}</p><p class="micro">No tiene en cuenta elasticidad, cortes, caída de tela ni preferencias personales.</p>${btn('Ver vista aproximada','data-try="'+p.id+'"','btn-outline')}</div>`;record('medidas_comparadas',{id:p.id});return;}if(e.target.id==='checkoutForm'){e.preventDefault();const p=getProduct(route.id);const district=$('#cDistrict').value;if(!district)return showToast('Elige un distrito.');const number='RV-'+String(Date.now()).slice(-7);store.set('order',{number,productName:p.name,productId:p.id,total:p.price+12,district});record('compra_simulada',{id:p.id,total:p.price+12});go('success');return;}}
document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('input',e=>{if(e.target.id==='fSearch'){filters.search=e.target.value;const pos=e.target.selectionStart;render();const el=$('#fSearch');el?.focus();el?.setSelectionRange(pos,pos);}});document.addEventListener('submit',handleSubmit);render();
</script>
</body></html>
